name: Keep Render Awake (24/7 No Sleep)

on:
  schedule:
    # Runs every 10 minutes (Render free services sleep after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive-ping:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        run: |
          TARGET_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            # Default to the deployed service URL or repository config
            TARGET_URL="https://sahil-portfolio.onrender.com"
          fi
          echo "Pinging: ${TARGET_URL}/api/health"
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 45 "${TARGET_URL}/api/health" || echo "failed")
          echo "Received status code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "SUCCESS: Service is awake and fully responsive."
          else
            echo "NOTICE: Wakeup signal dispatched (Status: $HTTP_STATUS)."
          fi
