<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Messages | Sahil Nawaz Portfolio</title>

  <!-- Google Fonts: Manrope & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-container {
      width: min(1000px, 92%);
      margin: 40px auto 80px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .admin-badge {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      position: relative;
    }
    .message-card.unread {
      border-left: 4px solid var(--primary);
      background: #fffdfc;
    }
    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .sender-info b {
      font-size: 1.1rem;
      font-family: var(--font-heading);
      color: var(--text-main);
    }
    .sender-info a {
      color: var(--primary);
      font-size: 0.9rem;
      margin-left: 8px;
    }
    .msg-timestamp {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .msg-subject {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-body);
      margin-bottom: 8px;
    }
    .msg-body {
      background: var(--bg-subtle);
      padding: 16px;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--text-main);
      white-space: pre-wrap;
      margin-bottom: 16px;
    }
    .msg-actions {
      display: flex;
      gap: 12px;
    }
    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-body);
      transition: var(--transition);
    }
    .btn-action:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-action.delete:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
      color: #ef4444;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container site-nav">
      <a href="index.html" class="logo">
        <span class="logo-badge">&lt;/&gt;</span>
        <span class="logo-text">
          Sahil <b>Nawaz</b>
          <small>Forward Deployed Developer</small>
        </span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="projects.html" class="nav-link">Projects</a>
        <a href="admin.html" class="nav-link active">Admin Inbox</a>
      </nav>

      <div class="nav-actions">
        <a href="index.html" class="btn-secondary">← Back to Portfolio</a>
      </div>
    </div>
  </header>

  <main class="admin-container">
    <div class="admin-header">
      <div>
        <span class="admin-badge">PORTFOLIO DATABASE</span>
        <h1 style="font-family: var(--font-heading); font-size: 2rem; margin-top: 6px;">Contact Inquiries Inbox</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Messages submitted via the contact form on your portfolio.</p>
      </div>
      <div>
        <button id="refresh-btn" class="btn-primary" style="padding: 8px 18px; font-size: 0.8rem;">⟳ Refresh Messages</button>
      </div>
    </div>

    <div id="messages-container" class="messages-list">
      <div class="empty-state">Loading messages...</div>
    </div>
  </main>

  <script>
    async function loadMessages() {
      const container = document.getElementById("messages-container");
      try {
        const apiUrl = window.location.origin.includes("5000") ? "/api/messages" : "http://127.0.0.1:5000/api/messages";
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (!data.success || !data.messages || data.messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <span style="font-size: 2.5rem; display: block; margin-bottom: 12px;">📬</span>
              <h3 style="font-family: var(--font-heading); margin-bottom: 6px; color: var(--text-main);">No inquiries yet</h3>
              <p>When visitors submit messages through your contact form, they will appear here.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = data.messages.map(msg => `
          <div class="message-card ${msg.status === 'unread' ? 'unread' : ''}" id="msg-${msg.id}">
            <div class="message-header">
              <div class="sender-info">
                <b>${escapeHtml(msg.name)}</b>
                <a href="mailto:${escapeHtml(msg.email)}?subject=Re: ${encodeURIComponent(msg.subject || 'Portfolio Inquiry')}">✉ ${escapeHtml(msg.email)}</a>
              </div>
              <div class="msg-timestamp">${new Date(msg.created_at).toLocaleString()}</div>
            </div>

            ${msg.subject ? `<div class="msg-subject">Subject: ${escapeHtml(msg.subject)}</div>` : ''}

            <div class="msg-body">${escapeHtml(msg.message)}</div>

            <div class="msg-actions">
              <a href="mailto:${escapeHtml(msg.email)}?subject=Re: ${encodeURIComponent(msg.subject || 'Portfolio Inquiry')}" class="btn-action">↩ Reply via Email</a>
              ${msg.status === 'unread' ? `<button onclick="markAsRead(${msg.id})" class="btn-action">✓ Mark as Read</button>` : '<span style="font-size: 0.75rem; color: #10b981; align-self: center;">✓ Read</span>'}
              <button onclick="deleteMsg(${msg.id})" class="btn-action delete">🗑 Delete</button>
            </div>
          </div>
        `).join("");

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state" style="color: #ef4444;">
            <p>Could not connect to backend server. Make sure <code>python backend/app.py</code> is running.</p>
          </div>
        `;
      }
    }

    async function markAsRead(id) {
      try {
        const apiUrl = window.location.origin.includes("5000") ? `/api/messages/${id}/read` : `http://127.0.0.1:5000/api/messages/${id}/read`;
        await fetch(apiUrl, { method: "PATCH" });
        loadMessages();
      } catch (e) {
        alert("Failed to mark as read");
      }
    }

    async function deleteMsg(id) {
      if (!confirm("Are you sure you want to delete this message?")) return;
      try {
        const apiUrl = window.location.origin.includes("5000") ? `/api/messages/${id}` : `http://127.0.0.1:5000/api/messages/${id}`;
        await fetch(apiUrl, { method: "DELETE" });
        loadMessages();
      } catch (e) {
        alert("Failed to delete message");
      }
    }

    function escapeHtml(text) {
      if (!text) return "";
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("refresh-btn").addEventListener("click", loadMessages);
    document.addEventListener("DOMContentLoaded", loadMessages);
  </script>
</body>
</html>
